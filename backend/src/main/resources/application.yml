server:
  # Porta HTTP modificabile senza intervenire sui file di configurazione.
  server:
  port: ${SERVER_PORT:8080}

spring:
  # Connessione al database e serializzazione delle risposte JSON.
  spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cultural_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
  jackson:
    default-property-inclusion: non_null

app:
  # Parametri usati per firmare e far scadere i token di accesso.
  app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
