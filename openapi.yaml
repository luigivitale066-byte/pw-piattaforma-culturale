openapi: 3.0.3
info:
  title: API Trame - Piattaforma di gestione culturale
  version: 1.0.0
  description: |
    Specifica OpenAPI del prototipo minimo funzionante (MVP) di una piattaforma digitale per un'organizzazione culturale.
    Gli endpoint gestiscono autenticazione (JWT), utenti, contenuti del catalogo, eventi, prenotazioni, feedback e statistiche amministrative.
servers:
  - url: http://localhost:8080/api
    description: Server di sviluppo locale
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    UserRegister:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Massimo 72 byte in codifica UTF-8.
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        email:
          type: string
        role:
          type: string
          example: ROLE_USER
        createdAt:
          type: string
          format: date-time
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, tokenType, expiresIn]
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Durata di validita del token in secondi
    CatalogItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        author:
          type: string
        year:
          type: integer
        mediaUrl:
          type: string
          format: uri
        category:
          type: string
        createdAt:
          type: string
          format: date-time
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0
        availableSeats:
          type: integer
          format: int64
          readOnly: true
          description: Capienza meno i posti occupati dalle prenotazioni con stato PENDING o CONFIRMED.
        createdAt:
          type: string
          format: date-time
    ReservationRequest:
      type: object
      required: [seats]
      properties:
        seats:
          type: integer
          minimum: 1
    Reservation:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
          nullable: true
        username:
          type: string
          nullable: true
        eventId:
          type: integer
          format: int32
        seats:
          type: integer
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        createdAt:
          type: string
          format: date-time
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        itemId:
          type: integer
          format: int32
          nullable: true
        eventId:
          type: integer
          format: int32
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    Stats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalReservations:
          type: integer
        eventsOccupancy:
          type: array
          items:
            type: object
            properties:
              eventId:
                type: integer
                format: int32
              occupancyPct:
                type: number
                format: float
    CatalogItemRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        description:
          type: string
        author:
          type: string
          maxLength: 255
        year:
          type: integer
          nullable: true
        mediaUrl:
          type: string
          format: uri
          nullable: true
          description: Collegamento HTTP o HTTPS.
        category:
          type: string
          maxLength: 128
    EventRequest:
      type: object
      required: [title, startDatetime, capacity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        description:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
          nullable: true
          description: Non deve precedere startDatetime.
        capacity:
          type: integer
          minimum: 0
        price:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          default: 0
    FeedbackRequest:
      type: object
      required: [rating]
      description: Deve essere indicato esattamente uno tra itemId ed eventId. L'utente viene ricavato dal token di autenticazione Bearer.
      properties:
        itemId:
          type: integer
          format: int32
          nullable: true
        eventId:
          type: integer
          format: int32
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 5000
          nullable: true
paths:
  /admin/users/{id}/role:
    put:
      summary: Assegna un ruolo a un altro utente (solo amministratore)
      description: La registrazione pubblica assegna sempre ROLE_USER. Gli amministratori non possono modificare il proprio ruolo. Le modifiche hanno effetto immediato sui permessi delle API.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [ROLE_USER, ROLE_OPERATOR, ROLE_ADMIN]
      responses:
        '200':
          description: Utente aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ruolo o identificativo utente mancante o non valido
        '401':
          description: Autenticazione richiesta
        '403':
          description: Ruolo di amministratore richiesto
        '404':
          description: Utente non trovato
        '409':
          description: Non e consentito modificare il proprio ruolo
  /users/me:
    get:
      summary: Restituisce il profilo dell'utente autenticato
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utente corrente, senza hash della password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token mancante o non valido
  /auth/register:
    post:
      summary: Registra un nuovo utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Effettua l'accesso e restituisce un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Autenticazione riuscita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Autenticazione non riuscita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      summary: Elenca gli utenti (solo amministratore)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Elenco degli utenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /catalog:
    get:
      summary: Elenca o cerca i contenuti del catalogo
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Elenco dei contenuti del catalogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
    post:
      summary: Crea un contenuto del catalogo (amministratore o operatore)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
      responses:
        '201':
          description: Contenuto creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
  /catalog/{id}:
    get:
      summary: Restituisce un contenuto del catalogo tramite identificativo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Contenuto del catalogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '404':
          description: Contenuto non trovato
  /events:
    get:
      summary: Elenca gli eventi
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Elenco degli eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Crea un evento (amministratore o operatore)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Evento creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /events/{id}:
    get:
      summary: Restituisce un evento tramite identificativo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /events/{id}/reservations:
    post:
      summary: Crea una prenotazione per un evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: Prenotazione creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Numero di posti o formato della richiesta non valido
        '401':
          description: Token mancante o non valido
        '404':
          description: Evento non trovato
        '409':
          description: Posti insufficienti oppure prenotazione attiva gia esistente
  /reservations:
    get:
      summary: "Elenca le prenotazioni attive (visitatore: proprie; operatore e amministratore: tutte)"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Elenco delle prenotazioni non annullate, con lo username del prenotante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
  /reservations/{id}/cancel:
    put:
      summary: Annulla una prenotazione
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Prenotazione annullata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
  /feedbacks:
    post:
      summary: Crea un feedback per un contenuto del catalogo o un evento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          description: Valutazione o scelta del contenuto o evento di riferimento non valida
        '404':
          description: Contenuto del catalogo o evento non trovato
    get:
      summary: Elenca i feedback con filtro per contenuto del catalogo o evento
      parameters:
        - in: query
          name: itemId
          schema:
            type: integer
            format: int32
        - in: query
          name: eventId
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Elenco dei feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
  /admin/stats:
    get:
      summary: Restituisce le statistiche di base riservate all'amministratore
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
security: []
